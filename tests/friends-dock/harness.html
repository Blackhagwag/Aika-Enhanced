<!doctype html>
<!--
  TEST HARNESS ONLY (not part of the theme). A skeleton of Steam's main window
  with the readable class names Aika styles (sections/library.css map:
  .OuterFrame > .TopBar, .ContentFrame > .Library > .Container > [left panel,
  .MainPanel], .BottomBarContainer > .BottomBar), Aika's main.css, and the
  fixture standing in for Steam's FriendStore (fixture.js).

  Query: ?theme=<path to a theme root, default ../..>  &preset=aika|hello-bert|greeny|rose-ash
         &opt=fdock-hover,fdock-by-game,…  (option files of the theme)  &nodock=1  &width=…
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steam</title>
<script>
  const q = new URLSearchParams(location.search);
  const theme = q.get("theme") || "../..";
  const add = (href) => document.write(`<link rel="stylesheet" href="${theme}/${href}">`);
  // option files load before the theme entry, as Millennium injects them
  add(`options/presets/${q.get("preset") || "aika"}.css`);
  for (const o of (q.get("opt") || "").split(",").filter(Boolean)) add(`options/${o}.css`);
  add("main.css");
</script>
<style>
  /* Steam's own layout, roughly (the theme only restyles it) */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .Wrapper, .OuterFrame { height: 100%; display: flex; flex-direction: column; }
  .TopBar { flex: none; height: 46px; display: flex; align-items: center; gap: 24px; padding: 0 16px; box-sizing: border-box; }
  .TitleBar { display: flex; align-items: center; width: 100%; gap: 16px; }
  .RootMenuBar { display: flex; gap: 4px; }
  .RootMenuButton { font: 13px var(--aika-font-ui); padding: 4px 8px; }
  .TitleBarControls { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .TitleBarControls .Button { width: 32px; height: 32px; display: grid; place-items: center; color: var(--aika-fg-muted); }
  .TitleBarControls .Button svg { width: 16px; height: 16px; fill: currentColor; }
  .AccountMenu { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; font: 13px var(--aika-font-ui); }
  .AccountMenu img.avatar { width: 24px; height: 24px; }
  .WindowControls { width: 138px; height: 32px; }
  .ContentFrame { flex: 1; min-height: 0; display: flex; }
  .Library { flex: 1; min-width: 0; display: flex; }
  .Library > .Container { flex: 1; display: flex; min-width: 0; }
  .Library > .Container > .Left { width: 272px; flex: none; display: flex; }
  .Library > .Container > .Left > .Container { flex: 1; display: flex; flex-direction: column; padding-top: 8px; }
  .HomeBox .Bar { margin: 0 6px 6px; padding: 8px 10px; font: 13px var(--aika-font-ui); color: var(--aika-fg); }
  .ReactVirtualized__List .Container { height: 32px; display: flex; align-items: center; font: 13px var(--aika-font-ui); }
  .GameListEntryContainer { display: flex; align-items: center; gap: 8px; }
  .GameIcon { width: 16px; height: 16px; background: var(--aika-bg-high); }
  .MainPanel { flex: 1; min-width: 0; overflow: hidden; padding: 24px 28px; box-sizing: border-box; }
  .Shelf h2 { font: 600 18px var(--aika-font-ui); color: var(--aika-fg); margin: 8px 0 14px; }
  .Covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .Cover { aspect-ratio: 2/3; border-radius: var(--aika-radius-lg); box-shadow: var(--aika-shadow-cover);
           background: linear-gradient(160deg, var(--aika-bg-high), var(--aika-bg-elevated)); }
  .BottomBar .Icon { width: 18px; height: 18px; border-radius: 50%; background: currentColor; opacity: .6; }
</style>
</head>
<body>
<div class="Wrapper ForceOpaqueBackground">
  <div class="OuterFrame">
    <div class="TopBar">
      <div class="TitleBar">
        <div class="RootMenuBar"><div class="RootMenuButton">Steam</div><div class="RootMenuButton">View</div><div class="RootMenuButton">Friends</div><div class="RootMenuButton" id="gamesRoot">Games</div><div class="RootMenuButton">Help</div></div>
        <div class="TitleBarControls _1-9sir4j_KQiMqdkZjQN0u">
          <div class="Button AnnouncementsButton _5wILZhsLODVwGfcJ0hKmJ" title="News"><svg class="Icon" viewBox="0 0 24 24"><path d="M4 10h4l8-5v14l-8-5H4z"/></svg></div>
          <div class="Button NotificationsButton RtSv39ZoBOySnb8XQ5hJf" title="Notifications"><svg class="Icon" viewBox="0 0 24 24"><path d="M6 17h12l-2-3V10a4 4 0 0 0-8 0v4z"/></svg><span class="Count">3</span></div>
          <div class="Button AnnouncementsButton _5wILZhsLODVwGfcJ0hKmJ GamepadUIToggle _3LKQ3S_yqrebeNLF6aeiog" title="Big Picture"><svg class="Icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/></svg></div>
          <div class="AccountMenu _3yD46y5pd3zOGR7CzKs0mC" id="account"><div class="avatarHolder"><img class="avatar" alt=""></div><div>Nikita</div><div class="WalletBalance">1 234 ₽</div></div>
        </div>
        <div class="WindowControls"><div class="title-bar-actions"></div></div>
      </div>
    </div>
    <div class="ContentFrame">
      <div class="Library">
        <div class="Container">
          <div class="Left">
            <div class="Container">
              <div class="HomeBox"><div class="Bar Selected">Home</div></div>
              <div class="ReactVirtualized__List" id="games"></div>
            </div>
          </div>
          <div class="MainPanel">
            <div class="LibraryHome">
              <div class="Shelf"><h2>Recent Games</h2><div class="Covers" id="covers"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="BottomBarContainer">
      <div class="BottomBar">
        <div class="AddGameButton"><div class="Icon"></div></div>
        <div class="DownloadStatus"><div class="DownloadStatusContent"><div class="Icon"></div></div></div>
        <div class="FriendsButton"><div class="Icon"></div></div>
      </div>
    </div>
  </div>
</div>
<script>
  const games = ["Baldur's Gate 3", "Counter-Strike 2", "Dota 2", "Hades II", "Hollow Knight", "Outer Wilds", "Portal 2", "Stardew Valley", "Valheim", "Disco Elysium"];
  const list = document.getElementById("games");
  games.forEach((g, i) => list.insertAdjacentHTML("beforeend",
    `<div class="Container ${i % 3 ? "Installed" : ""} ${i === 1 ? "Selected" : ""}"><div class="GameListEntryContainer"><div class="GameIcon"></div><span>${g}</span></div></div>`));
  const covers = document.getElementById("covers");
  for (let i = 0; i < 12; i++) covers.insertAdjacentHTML("beforeend", `<div class="Cover"></div>`);
</script>
<script type="module">
  const q = new URLSearchParams(location.search);
  await import("./fixture.js");
  if (q.get("millennium")) await import("./millennium-stub.js");
  if (q.get("engine")) {
    window.__aikaTestClient = true;
    // the Steam Enhanced parts, as skin.json's ".*" patch loads them (a module with a src)
    const s = document.createElement("script");
    s.type = "module";
    s.src = "../../vendor/steam-enhanced/client/loader.js";
    document.head.append(s);
  }
  if (!q.get("nodock")) {
    const theme = q.get("theme") || "../..";
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason)));
    await import(`${theme}/js/friends-dock.js`);
  }
  document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
